name: Fast CI & PDF Test Report

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'

concurrency:
  group: \({{ github.workflow }}-\){{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast-test-and-pdf:
    name: Execute Tests & Generate PDF Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 # Fast clone for rapid testing

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # ---------------------------------------------------------------------------
      # RUN TESTS & GENERATE HTML REPORT
      # ---------------------------------------------------------------------------
      - name: Run Tests with HTML Reporter
        run: |
          # Uses jest-html-reporter or standard test html output
          npm test -- --reporters=default --reporters=jest-html-reporter \
            --config='{"pageTitle": "Automated Test Report", "outputPath": "test-report.html"}'
        continue-on-error: true # Ensure PDF is generated even if tests fail

      # ---------------------------------------------------------------------------
      # CONVERT HTML TEST REPORT TO PDF
      # ---------------------------------------------------------------------------
   name: Ultra-Fast CI & PDF Export

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-and-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install & Run Tests
        run: |
          npm ci
          npm test -- --reporters=default --reporters=jest-html-reporter \
            --config='{"pageTitle": "Test Report", "outputPath": "test-report.html"}'
        continue-on-error: true

      # Zero installation step: Runs instantly using Python standard library
      - name: Convert HTML Report to PDF via Hugging Face Space
        run: |
          python .github/scripts/convert_to_pdf.py \
            "test-report.html" \
            "test-report.pdf" \
            "https://YOUR-HF-USERNAME-YOUR-SPACE-NAME.hf.space"

      - name: Upload PDF Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test-Report-${{ github.sha }}
          path: test-report.pdf
          retention-days: 7------------------
      # UPLOAD PDF ARTIFAC
      # ---------------------------------------------------------------------------
      - name: Upload PDF Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test-Report-${{ github.sha }}
          path: test-report.pdf
          retention-days: 7 # Keep artifact retention low to reduce storage costs
