name: CI Pipeline & PDF Export

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: \({{ github.workflow }}-\){{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-pdf:
    name: Execute Tests & Export PDF
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test
        continue-on-error: true

      - name: Convert HTML Report to PDF
        run: |
          python .github/scripts/convert_to_pdf.py \
            "test-report.html" \
            "test-report.pdf" \
            "https://ejabath-pdfer.hf.space"

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test-Report-${{ github.sha }}
          path: test-report.pdf
          retention-days: 7
